<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>我的工具库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M16 7l2.2 4.6 5 .7-3.6 3.5.9 5L16 18.2l-4.5 2.6.9-5-3.6-3.5 5-.7z' fill='%23fff'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{
  background:linear-gradient(135deg,#e8f4ff 0%,#dde3ff 100%);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:32px 16px;
}
h1{color:#2d3748;margin-bottom:32px;font-weight:600;font-size:28px;}
.page{display:none;width:100%;max-width:420px;}
.page.active{display:block;}

/* 首页 */
.home-buttons{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.home-btn{
  width:170px;height:170px;border:none;border-radius:20px;
  font-size:22px;color:#fff;cursor:pointer;user-select:none;
  background:linear-gradient(135deg,#48bb78,#38a169);
  box-shadow:0 6px 16px rgba(0,0,0,.14);
  transition:transform .2s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.home-btn:nth-child(2){
  background:linear-gradient(135deg,#3182ce,#2b6cb0);
}
.home-btn:nth-child(3){
  background:linear-gradient(135deg,#d69e2e,#b7791f);
}
.home-btn:active{transform:scale(.96);box-shadow:0 3px 8px rgba(0,0,0,.12);}

.back-btn{
  margin-top:24px;width:100%;padding:12px;border:none;border-radius:10px;
  background:#718096;color:#fff;font-size:17px;cursor:pointer;user-select:none;
  transition:background .2s;-webkit-tap-highlight-color:transparent;
}
.back-btn:active{background:#4a5568;}

/* === 计算器样式 === */
.calc-container{max-width:360px;margin:0 auto;position:relative;}
.calc-title{text-align:center;margin-bottom:16px;color:#2d3748;font-size:22px;}

.history-toggle{
  position:absolute;top:0;right:0;padding:4px 8px;font-size:14px;
  color:#3182ce;background:rgba(255,255,255,.7);border:none;border-radius:6px;cursor:pointer;
}
.history-panel{
  display:none;position:absolute;top:30px;right:0;left:0;
  background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);
  max-height:220px;overflow-y:auto;padding:10px;z-index:10;
}
.history-panel.show{display:block;}
.history-item{
  padding:8px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px;
  color:#2d3748;
}
.history-item:active{background:#edf2f7;}
.history-clear{margin-top:8px;padding:6px;width:100%;border:none;color:#e53e3e;background:#fef2f2;border-radius:6px;cursor:pointer;}

.calc-screen-wrap{
  background:#1a202c;border-radius:16px;padding:20px;margin:40px 0 16px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.3);
}
.calc-pre{
  color:#a0aec0;font-size:16px;min-height:24px;text-align:right;
  word-break:break-all;
}
.calc-screen{
  color:#fff;text-align:right;min-height:64px;
  overflow-x:auto;white-space:nowrap;margin-top:8px;
  font-variant-numeric:tabular-nums;
}
.shake{animation:shake .4s ease;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-6px);}
  40%,80%{transform:translateX(6px);}
}

.calc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.calc-btn{
  padding:18px 0;font-size:20px;border:none;border-radius:12px;
  cursor:pointer;background:#edf2f7;user-select:none;
  transition:all .12s ease;-webkit-tap-highlight-color:transparent;
}
.calc-btn:active{filter:brightness(.82);transform:scale(.96);}
.calc-btn.op{background:#ed8936;color:#fff;}
.calc-btn.func{background:#805ad5;color:#fff;}
.calc-btn.eq{background:#3182ce;color:#fff;}
.calc-btn.ac{background:#e53e3e;color:#fff;}

/* === 地图查看器页面样式 === */
.map-page .tip{
  font-size:13px;color:#718096;text-align:center;margin-bottom:12px;line-height:1.5;
}
.map-select{
  width:100%;padding:10px;border-radius:10px;border:1px solid #cbd5e0;font-size:16px;margin-bottom:12px;
}
.map-actions{
  display:flex;gap:10px;margin-bottom:12px;
}
.map-actions button{
  flex:1;padding:10px;border:none;border-radius:10px;font-size:15px;cursor:pointer;color:#fff;
  -webkit-tap-highlight-color:transparent;
}
.btn-goto-official{background:#2f855a;}
.btn-reset-view{background:#2b6cb0;}

.viewport-wrap{
  width:100%;height:60vh;
  background:#111;border-radius:12px;overflow:hidden;position:relative;
  touch-action:none;color:#aaa;
  display:flex;align-items:center;justify-content:center;
}
.load-hint{
  position:absolute;z-index:2;font-size:15px;text-align:center;padding:10px;
}
.viewport-img{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  transform-origin:center center;
  cursor:grab;
}
.viewport-img:active{cursor:grabbing;}

.map-disclaimer{
  margin-top:12px;font-size:12px;color:#a0aec0;text-align:center;padding:0 8px;
}
#page-map .back-btn{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:16px;width:min(420px,calc(100% - 32px));
  z-index:60;background:#2b6cb0;font-weight:600;font-size:17px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* === 证书奖状生成器样式（#page-cert 作用域隔离） === */
#page-cert{max-width:1200px;}
#page-cert .form-card,
#page-cert .preview-card {
  background:#ffffff;border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.08);
}
#page-cert .template-card{border:2px solid #e5e7eb;border-radius:14px;padding:10px;cursor:pointer;transition:all .2s ease;background:#fff;}
#page-cert .template-card.active{border-color:#4f46e5;box-shadow:0 8px 20px rgba(79,70,229,.18);}
#page-cert .template-card:hover{transform:translateY(-1px);}
#page-cert .template-preview{height:56px;border-radius:10px;margin-bottom:8px;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.06);}

#page-cert .cert-paper{width:820px;height:560px;padding:40px;position:relative;text-align:center;overflow:hidden;flex-shrink:0;background-color:#fbfbf6;}
#page-cert .cert-paper::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.012) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.008) 1px,transparent 1px);background-size:3px 3px,7px 7px;background-position:0 0,1px 2px;opacity:.35;}

#page-cert .template1.cert-paper{background-color:#fdfaf1;border:22px solid #8a1a1a;box-shadow:inset 0 0 0 7px #fdfaf1,inset 0 0 0 13px #c9a24a,inset 0 0 0 18px #8a1a1a,0 10px 30px rgba(0,0,0,.12);}
#page-cert .template1 .title{font-family:"STKaiti","KaiTi","楷体","Noto Serif SC",serif;font-size:54px;font-weight:900;letter-spacing:18px;color:#8a1a1a;margin-bottom:14px;}
#page-cert .template1 .subtitle{font-size:16px;letter-spacing:8px;color:#8a1a1a;margin-bottom:24px;}
#page-cert .template1 .name{font-family:"STKaiti","KaiTi","楷体",serif;font-size:32px;font-weight:bold;color:#111827;margin:16px 0;}
#page-cert .template1 .content{font-size:21px;line-height:2;color:#374151;padding:0 50px;margin:22px 0;}
#page-cert .template1 .footer{font-size:19px;color:#4b5563;text-align:right;padding-right:40px;margin-top:30px;}

#page-cert .template2.cert-paper{background-color:#f5f8fd;border:20px solid #1e3a8a;box-shadow:inset 0 0 0 7px #f5f8fd,inset 0 0 0 13px #94b8e0,inset 0 0 0 18px #1e3a8a,0 10px 30px rgba(0,0,0,.12);}
#page-cert .template2 .title{font-family:"STKaiti","KaiTi","楷体","Noto Serif SC",serif;font-size:50px;font-weight:900;letter-spacing:14px;color:#1e3a8a;margin-bottom:14px;}
#page-cert .template2 .subtitle{font-size:15px;letter-spacing:8px;color:#1e3a8a;margin-bottom:24px;}
#page-cert .template2 .name{font-size:31px;font-weight:bold;color:#0f172a;margin:16px 0;}
#page-cert .template2 .content{font-size:21px;line-height:2;color:#334155;padding:0 50px;margin:22px 0;}
#page-cert .template2 .footer{font-size:19px;color:#475569;text-align:right;padding-right:40px;margin-top:30px;}

#page-cert .template3.cert-paper{background-color:#f4e7c5;border:18px solid #6b4423;box-shadow:inset 0 0 0 7px #f4e7c5,inset 0 0 0 13px #b58444,inset 0 0 0 18px #6b4423,0 10px 30px rgba(0,0,0,.12);}
#page-cert .template3 .title{font-family:"STKaiti","KaiTi","楷体","Noto Serif SC",serif;font-size:52px;font-weight:900;letter-spacing:16px;color:#5b2c0f;margin-bottom:14px;}
#page-cert .template3 .subtitle{font-size:16px;letter-spacing:8px;color:#5b2c0f;margin-bottom:24px;}
#page-cert .template3 .name{font-family:"STKaiti","KaiTi","楷体",serif;font-size:32px;font-weight:bold;color:#2b1608;margin:16px 0;}
#page-cert .template3 .content{font-size:21px;line-height:2;color:#3b2410;padding:0 50px;margin:22px 0;}
#page-cert .template3 .footer{font-size:19px;color:#3b2410;text-align:right;padding-right:40px;margin-top:30px;}

#page-cert .stamp{position:absolute;bottom:40px;right:40px;width:146px;height:146px;border-radius:50%;border:4px solid #b91c1c;background:transparent;background-image:radial-gradient(circle,rgba(185,28,28,.08) 0%,transparent 70%);box-shadow:inset 0 0 0 5px #b91c1c;transform:rotate(-5deg);display:flex;align-items:center;justify-content:center;overflow:hidden;filter:url(#stampNoise);}
#page-cert .stamp-ring-text{position:absolute;top:12px;left:0;right:0;height:68px;color:#b91c1c;font-weight:900;font-size:14px;letter-spacing:1px;}
#page-cert .stamp-star{position:absolute;top:56px;left:50%;transform:translateX(-50%);color:#b91c1c;font-size:18px;}
#page-cert .stamp-center{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:14px;font-weight:900;color:#b91c1c;letter-spacing:2px;}

#page-cert .preview-outer{width:100%;overflow:auto;background:#e5e7eb;border-radius:16px;padding:18px;}
#page-cert .preview-inner{display:flex;justify-content:center;align-items:flex-start;min-width:100%;}
#page-cert #previewBox{transform-origin:top center;transition:transform .2s ease;}
@media (max-width:900px){#page-cert #previewBox{transform:scale(.55);}}
@media (max-width:640px){#page-cert #previewBox{transform:scale(.42);}}

.loading-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:999;}
.loading-mask.show{display:flex;}
.loading-box{background:#fff;padding:20px 28px;border-radius:14px;font-weight:bold;color:#1f2937;}
#page-cert input,#page-cert textarea{transition:all .2s ease;}
#page-cert input:focus,#page-cert textarea:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 4px rgba(79,70,229,.14);}

/* === 抽奖工具样式（#page-lottery 作用域隔离） === */
#page-home .home-btn:nth-child(4){
  background:linear-gradient(135deg,#805ad5,#6b46c1);
}
#page-lottery .tabs{display:flex;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px;}
#page-lottery .tab{flex:1;padding:11px 0;border:none;border-radius:9px;background:transparent;color:#4a5568;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;}
#page-lottery .tab.active{background:linear-gradient(135deg,#3182ce,#2b6cb0);color:#fff;}
#page-lottery .view{display:none;}
#page-lottery .view.active{display:block;animation:fadeLot .25s ease;}
@keyframes fadeLot{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

#page-lottery .card{background:#fff;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:18px;margin-bottom:16px;}
#page-lottery .card h3{color:#2d3748;font-size:17px;margin-bottom:12px;}
#page-lottery label{display:block;font-size:14px;color:#4a5568;margin:12px 0 6px;}
#page-lottery textarea,#page-lottery input[type=text],#page-lottery input[type=number]{
  width:100%;padding:11px;border:1px solid #cbd5e0;border-radius:10px;font-size:16px;color:#2d3748;background:#fff;transition:border .2s,box-shadow .2s;
}
#page-lottery textarea:focus,#page-lottery input[type=text]:focus,#page-lottery input[type=number]:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 4px rgba(79,70,229,.12);}
#page-lottery .btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;transition:transform .12s,filter .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent;}
#page-lottery .btn:active{transform:scale(.97);filter:brightness(.92);}
#page-lottery .btn-primary{background:linear-gradient(135deg,#48bb78,#38a169);box-shadow:0 4px 10px rgba(56,161,105,.3);}
#page-lottery .btn-blue{background:linear-gradient(135deg,#3182ce,#2b6cb0);box-shadow:0 4px 10px rgba(43,108,176,.3);}
#page-lottery .btn-gray{background:#718096;box-shadow:0 4px 10px rgba(113,128,150,.3);}
#page-lottery .btn-red{background:linear-gradient(135deg,#e53e3e,#c53030);box-shadow:0 4px 10px rgba(197,48,48,.3);}
#page-lottery .btn:disabled{opacity:.5;cursor:not-allowed;}
#page-lottery .btn-row{display:flex;gap:10px;margin-top:12px;}
#page-lottery .btn-row .btn{flex:1;}
#page-lottery .hint{font-size:13px;color:#718096;margin-top:8px;line-height:1.5;}
#page-lottery .name-list{margin-top:12px;max-height:220px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:10px;padding:8px;}
#page-lottery .name-chip{display:inline-block;background:#edf2f7;color:#2d3748;border-radius:8px;padding:4px 10px;margin:3px;font-size:14px;}
#page-lottery .count-tag{color:#3182ce;font-weight:600;}
#page-lottery .result-wrap{margin-top:16px;}
#page-lottery .result-title{font-size:15px;color:#4a5568;margin-bottom:8px;}
#page-lottery .winners{display:flex;flex-wrap:wrap;gap:8px;}
#page-lottery .winner{background:linear-gradient(135deg,#d69e2e,#b7791f);color:#fff;font-size:18px;font-weight:700;border-radius:10px;padding:10px 16px;animation:popLot .3s ease;}
@keyframes popLot{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
#page-lottery .rolling{height:64px;border-radius:12px;background:#1a202c;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;margin-top:12px;}
#page-lottery .rolling span{position:absolute;white-space:nowrap;}

#page-lottery .wheel-list{margin-top:6px;}
#page-lottery .wheel-item{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;transition:transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent;}
#page-lottery .wheel-item:active{transform:scale(.98);box-shadow:0 2px 6px rgba(0,0,0,.08);}
#page-lottery .wheel-icon{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
#page-lottery .wheel-info{flex:1;min-width:0;}
#page-lottery .wheel-name{font-size:15px;font-weight:600;color:#2d3748;}
#page-lottery .wheel-opts{font-size:12px;color:#718096;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#page-lottery .wheel-actions{display:flex;gap:6px;flex-shrink:0;}
#page-lottery .wheel-actions button{border:none;background:#edf2f7;border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer;color:#4a5568;transition:background .15s;}
#page-lottery .wheel-actions button:active{background:#e2e8f0;}
#page-lottery .wheel-actions .del{color:#e53e3e;}
#page-lottery .add-wheel{width:100%;padding:11px;border:2px dashed #cbd5e0;border-radius:12px;background:transparent;color:#4f46e5;font-size:15px;font-weight:600;cursor:pointer;transition:border .2s,background .2s;-webkit-tap-highlight-color:transparent;}
#page-lottery .add-wheel:active{background:#eef2ff;border-color:#4f46e5;}
#page-lottery .wheel-stage{display:none;}
#page-lottery .wheel-stage.show{display:block;}
#page-lottery .wheel-holder{position:relative;width:min(300px,100%);margin:10px auto;aspect-ratio:1/1;}
#page-lottery canvas{width:100%;height:100%;display:block;}
#page-lottery .pointer{position:absolute;top:0;left:50%;transform:translate(-50%,-6px);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #1a202c;z-index:5;}
#page-lottery .pointer::after{content:"";position:absolute;left:-22px;top:-34px;width:44px;height:44px;border:5px solid #3182ce;border-radius:50%;background:#fff;}
#page-lottery .wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;background:linear-gradient(135deg,#3182ce,#2b6cb0);border-radius:50%;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.3);}
#page-lottery .spin-result{text-align:center;font-size:22px;font-weight:700;color:#b7791f;min-height:32px;margin:10px 0;}
#page-lottery .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);align-items:center;justify-content:center;z-index:99;padding:16px;}
#page-lottery .modal.show{display:flex;}
#page-lottery .modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;}
#page-lottery .modal-box h3{color:#2d3748;margin-bottom:8px;}

/* === 新增：2048 / 扫雷 小工具页（游戏代码原样内嵌于本文件，不改动） === */
#page-home .home-btn:nth-child(5){
  background:linear-gradient(135deg,#e53e3e,#c53030);
}
#page-home .home-btn:nth-child(6){
  background:linear-gradient(135deg,#2b6cb0,#1e40af);
}
.game-page{max-width:520px;}
.game-frame{
  width:100%;border:none;display:block;border-radius:14px;
  background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);
}
.game-frame-2048{height:600px;}
.game-frame-mine{height:720px;}
</style>
</head>
<body>

<!-- svg滤镜，印章噪点斑驳效果 -->
<svg style="position:absolute;width:0;height:0;">
  <filter id="stampNoise">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" />
  </filter>
</svg>

<div class="loading-mask" id="loadingMask">
  <div class="loading-box">正在生成高清图片，请稍候...</div>
</div>

<!-- 首页 -->
<div id="page-home" class="page active">
  <h1>我的工具库</h1>
  <div class="home-buttons">
    <button class="home-btn" onclick="safeWrap(showPage,'page-calc')">🧮 计算器</button>
    <button class="home-btn" onclick="safeWrap(showPage,'page-map')">🗺️ 地图查看</button>
    <button class="home-btn" onclick="safeWrap(showPage,'page-cert')">🏆 证书奖状</button>
    <button class="home-btn" onclick="safeWrap(showPage,'page-lottery')">🎯 抽奖工具</button>
    <button class="home-btn" onclick="safeWrap(showPage,'page-2048')">🎮 2048</button>
    <button class="home-btn" onclick="safeWrap(showPage,'page-minesweeper')">💣 扫雷</button>
  </div>
</div>

<!-- 计算器页 -->
<div id="page-calc" class="page">
  <div class="calc-container">
    <h2 class="calc-title">高精度计算器</h2>
    <button class="history-toggle" onclick="safeWrap(toggleHistory)">📜 历史</button>
    <div class="history-panel" id="historyPanel">
      <div id="historyList"></div>
      <button class="history-clear" onclick="safeWrap(clearHistory)">清空历史</button>
    </div>

    <div class="calc-screen-wrap">
      <div class="calc-pre" id="calc-pre"></div>
      <div class="calc-screen" id="calc-screen">0</div>
    </div>

    <div class="calc-buttons">
      <button class="calc-btn ac" onclick="safeWrap(calcClear)">AC</button>
      <button class="calc-btn func" onclick="safeWrap(calcInput,'(')">(</button>
      <button class="calc-btn func" onclick="safeWrap(calcInput,')')">)</button>
      <button class="calc-btn func" onclick="safeWrap(calcPercent)">%</button>

      <button class="calc-btn" onclick="safeWrap(calcInput,'7')">7</button>
      <button class="calc-btn" onclick="safeWrap(calcInput,'8')">8</button>
      <button class="calc-btn" onclick="safeWrap(calcInput,'9')">9</button>
      <button class="calc-btn op" onclick="safeWrap(calcInput,'/')">÷</button>

&lt;style&gt;

&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;header&quot;&gt;
  &lt;h1&gt;2048&lt;/h1&gt;
  &lt;div class=&quot;score-wrap&quot;&gt;
    &lt;div class=&quot;score-box&quot;&gt;本局&lt;br&gt;&lt;span id=&quot;currentScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;score-box&quot;&gt;最高分&lt;br&gt;&lt;span id=&quot;bestScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;button id=&quot;newGame&quot;&gt;新游戏&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;container&quot; id=&quot;gameContainer&quot;&gt;
  &lt;div class=&quot;mask&quot; id=&quot;gameOver&quot;&gt;
    &lt;h2&gt;游戏结束&lt;/h2&gt;
    &lt;p&gt;没有可移动的方块了&lt;/p&gt;
    &lt;button onclick=&quot;restartGame()&quot;&gt;再来一局&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;mask&quot; id=&quot;winMask&quot;&gt;
    &lt;h2&gt;🎉 胜利！&lt;/h2&gt;
    &lt;p&gt;成功合成2048！可以继续挑战更高分数&lt;/p&gt;
    &lt;button onclick=&quot;closeWin()&quot;&gt;继续游戏&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const size = 4;
let grid = [];
let currentScore = 0;
let isWin = false;
const container = document.getElementById(&quot;gameContainer&quot;);
const currentScoreDom = document.getElementById(&quot;currentScore&quot;);
const bestScoreDom = document.getElementById(&quot;bestScore&quot;);
const gameOverDom = document.getElementById(&quot;gameOver&quot;);
const winMask = document.getElementById(&quot;winMask&quot;);

// 读取本地最高分
function getBestScore(){
  const saved = localStorage.getItem(&quot;2048BestScore&quot;);
  return saved ? parseInt(saved) : 0;
}
let bestScore = getBestScore();
bestScoreDom.innerText = bestScore;

// 保存最高分
function saveBestScore(){
  localStorage.setItem(&quot;2048BestScore&quot;, bestScore);
  bestScoreDom.innerText = bestScore;
}

// 绘制背景格子
function initBg(){
  container.querySelectorAll(&quot;.grid-cell&quot;).forEach(e=&gt;e.remove());
  const cellSize = `calc((100% - 56px)/4)`;
  for(let i=0;i&lt;size;i++){
    for(let j=0;j&lt;size;j++){
      const div = document.createElement(&quot;div&quot;);
      div.className = &quot;grid-cell&quot;;
      div.style.width = cellSize;
      div.style.height = cellSize;
      div.style.left = `calc(14px + ${j} * (${cellSize} + 14px))`;
      div.style.top = `calc(14px + ${i} * (${cellSize} + 14px))`;
      container.appendChild(div);
    }
  }
}

// 初始化游戏
function initGame(){
  grid = Array(size).fill().map(()=&gt;Array(size).fill(0));
  currentScore = 0;
  isWin = false;
  currentScoreDom.innerText = currentScore;
  gameOverDom.style.display = &quot;none&quot;;
  winMask.style.display = &quot;none&quot;;
  clearNumber();
  randomCell();
  randomCell();
  render();
}

function clearNumber(){
  container.querySelectorAll(&quot;.number-cell&quot;).forEach(e=&gt;e.remove());
}

// 随机生成2或4
function randomCell(){
  let empty = [];
  for(let i=0;i&lt;size;i++){
    for(let j=0;j&lt;size;j++){
      if(grid[i][j]===0) empty.push({x:i,y:j});
    }
  }
  if(empty.length===0) return;
  const p = empty[Math.floor(Math.random()*empty.length)];
  grid[p.x][p.y] = Math.random()&gt;0.2 ? 2 :4;
}

// 方块配色
const colorMap = {
  2:&quot;#eee4da&quot;,
  4:&quot;#ede0c8&quot;,
  8:&quot;#f2b179&quot;,
  16:&quot;#f59563&quot;,
  32:&quot;#f67c5f&quot;,
  64:&quot;#f65e3b&quot;,
  128:&quot;#edcf72&quot;,
  256:&quot;#edcc61&quot;,
  512:&quot;#edc850&quot;,
  1024:&quot;#edc53f&quot;,
  2048:&quot;#edc22e&quot;,
  4096:&quot;#3c3a32&quot;,
  8192:&quot;#2b2824&quot;
}

// 渲染方块
function render(){
  clearNumber();
  const cellSize = `calc((100% - 56px)/4)`;
  for(let i=0;i&lt;size;i++){
    for(let j=0;j&lt;size;j++){
      const val = grid[i][j];
      if(val!==0){
        const div = document.createElement(&quot;div&quot;);
        div.className=&quot;number-cell&quot;;
        div.innerText = val;
        div.style.width = cellSize;
        div.style.height = cellSize;
        div.style.left = `calc(14px + ${j} * (${cellSize} + 14px))`;
        div.style.top = `calc(14px + ${i} * (${cellSize} + 14px))`;
        div.style.background = colorMap[val] || &quot;#3c3a32&quot;;
        if(val&gt;=8) div.style.color=&quot;#fff&quot;;
        container.appendChild(div);
      }
    }
  }
}

// 单行左移
function moveLeft(row){
  let arr = row.filter(v=&gt;v!==0);
  for(let i=0;i&lt;arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i] *=2;
      currentScore += arr[i];
      arr[i+1]=0;
    }
  }
  arr = arr.filter(v=&gt;v!==0);
  while(arr.length&lt;size) arr.push(0);
  return arr;
}

// 矩阵旋转
function rotate(mat){
  let res = Array(size).fill().map(()=&gt;Array(size).fill(0));
  for(let i=0;i&lt;size;i++)
    for(let j=0;j&lt;size;j++)
      res[j][size-1-i] = mat[i][j];
  return res;
}

function move(dir){
  let old = JSON.parse(JSON.stringify(grid));
  if(dir===&quot;left&quot;) grid = grid.map(r=&gt;moveLeft(r));
  if(dir===&quot;right&quot;){
    grid = grid.map(r=&gt;moveLeft(r.reverse()).reverse());
  }
  if(dir===&quot;up&quot;){
    grid = rotate(grid);
    grid = grid.map(r=&gt;moveLeft(r));
    grid = rotate(rotate(rotate(grid)));
  }
  if(dir===&quot;down&quot;){
    grid = rotate(grid);
    grid = grid.map(r=&gt;moveLeft(r.reverse()).reverse());
    grid = rotate(rotate(rotate(grid)));
  }
  currentScoreDom.innerText = currentScore;
  // 更新最高分
  if(currentScore &gt; bestScore){
    bestScore = currentScore;
    saveBestScore();
  }
  if(JSON.stringify(old)!==JSON.stringify(grid)){
    randomCell();
    render();
    // 给新生成方块加弹出动画
    const cells = container.querySelectorAll(&quot;.number-cell&quot;);
    cells.forEach(el=&gt;el.classList.add(&quot;pop&quot;));
    setTimeout(()=&gt;{
      cells.forEach(el=&gt;el.classList.remove(&quot;pop&quot;));
    },200)
    checkWin();
    checkGameOver();
  }
}

// 判断胜利（合成2048）
function checkWin(){
  if(isWin) return;
  for(let i=0;i&lt;size;i++){
    for(let j=0;j&lt;size;j++){
      if(grid[i][j] &gt;=2048){
        isWin = true;
        winMask.style.display=&quot;flex&quot;;
        return;
      }
    }
  }
}
function closeWin(){
  winMask.style.display=&quot;none&quot;;
}

// 判断是否还能移动
function canMove(){
  for(let i=0;i&lt;size;i++){
    for(let j=0;j&lt;size;j++){
      if(grid[i][j]===0) return true;
      if(j&lt;3 &amp;&amp; grid[i][j]===grid[i][j+1]) return true;
      if(i&lt;3 &amp;&amp; grid[i][j]===grid[i+1][j]) return true;
    }
  }
  return false;
}
function checkGameOver(){
  if(!canMove()) gameOverDom.style.display=&quot;flex&quot;;
}

// 键盘控制（电脑）
document.addEventListener(&quot;keydown&quot;,e=&gt;{
  const map = {ArrowLeft:&quot;left&quot;,ArrowRight:&quot;right&quot;,ArrowUp:&quot;up&quot;,ArrowDown:&quot;down&quot;};
  if(map[e.key]){
    e.preventDefault();
    move(map[e.key]);
  }
})

// 触屏滑动（手机）
let touchStartX = 0;
let touchStartY = 0;
container.addEventListener(&#x27;touchstart&#x27;, e =&gt; {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
container.addEventListener(&#x27;touchend&#x27;, e =&gt; {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const minDis = 30;
  if(Math.abs(dx) &gt; Math.abs(dy)){
    if(dx &gt; minDis) move(&quot;right&quot;);
    else if(dx &lt; -minDis) move(&quot;left&quot;);
  }else{
    if(dy &gt; minDis) move(&quot;down&quot;);
    else if(dy &lt; -minDis) move(&quot;up&quot;);
  }
});

function restartGame(){
  initGame();
}
document.getElementById(&quot;newGame&quot;).onclick = restartGame;

initBg();
initGame();
&lt;/script&gt;

&lt;script&gt;
// ===== 难度配置 =====
const LEVELS = {
  easy: {x:8,  y:9,  mines:10},
  mid:  {x:16, y:16, mines:40},
  hard: {x:30, y:16, mines:99}
};
const lvNames = {easy:&#x27;初级&#x27;, mid:&#x27;中级&#x27;, hard:&#x27;高级&#x27;};

let cfg = LEVELS.easy;
let mine=null, open=null, flag=null;
let sX=0, sY=0;
let started=false, over=false, won=false;
let mineLeft=0, timeSec=0, timerId=null;
let flagMode=false;   // false=翻开模式，true=标旗模式

const boardEl=document.getElementById(&#x27;board&#x27;);
const minesEl=document.getElementById(&#x27;minesLeft&#x27;);
const timerEl=document.getElementById(&#x27;timer&#x27;);
const faceEl=document.getElementById(&#x27;face&#x27;);

// ===== SVG 图标 =====
const ICON_MINE=&#x27;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9.5&quot; fill=&quot;#ef4444&quot; stroke=&quot;#7f1d1d&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;3.6&quot; fill=&quot;#111&quot;/&gt;&lt;circle cx=&quot;15.2&quot; cy=&quot;8.8&quot; r=&quot;1.1&quot; fill=&quot;#fff&quot; opacity=&quot;.8&quot;/&gt;&lt;/svg&gt;&#x27;;
const ICON_FLAG=&#x27;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;rect x=&quot;5.5&quot; y=&quot;3&quot; width=&quot;3&quot; height=&quot;18&quot; rx=&quot;1.5&quot; fill=&quot;#b45309&quot;/&gt;&lt;path d=&quot;M8 4h9l-2.5 3.2L17 10.4H8z&quot; fill=&quot;#f59e0b&quot; stroke=&quot;#b45309&quot; stroke-width=&quot;1&quot;/&gt;&lt;/svg&gt;&#x27;;

// ===== 表情 =====
function setFace(state){
  const e=&#x27;&lt;circle cx=&quot;16&quot; cy=&quot;16&quot; r=&quot;14&quot; fill=&quot;#fff7df&quot;/&gt;&#x27;;
  let extra;
  if(state===&#x27;won&#x27;) extra=&#x27;&lt;path d=&quot;M8 14.5c2.5-3 13.5-3 16 0&quot; stroke=&quot;#3a2a14&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;20&quot; cy=&quot;12.5&quot; r=&quot;2.4&quot; fill=&quot;#3a2a14&quot;/&gt;&#x27;;
  else if(state===&#x27;lost&#x27;) extra=&#x27;&lt;circle cx=&quot;11&quot; cy=&quot;12.5&quot; r=&quot;2.2&quot; fill=&quot;#3a2a14&quot;/&gt;&lt;circle cx=&quot;21&quot; cy=&quot;12.5&quot; r=&quot;2.2&quot; fill=&quot;#3a2a14&quot;/&gt;&lt;path d=&quot;M8 21c2.2-2.8 11.8-2.8 14 0&quot; stroke=&quot;#3a2a14&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;;
  else extra=&#x27;&lt;circle cx=&quot;11&quot; cy=&quot;12.5&quot; r=&quot;2.2&quot; fill=&quot;#3a2a14&quot;/&gt;&lt;circle cx=&quot;21&quot; cy=&quot;12.5&quot; r=&quot;2.2&quot; fill=&quot;#3a2a14&quot;/&gt;&lt;path d=&quot;M9 19c2.2 2.8 11.8 2.8 14 0&quot; stroke=&quot;#3a2a14&quot; stroke-width=&quot;2.4&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;;
  faceEl.innerHTML=e+extra;
}

// ===== 初始化 =====
function init(){
  clearInterval(timerId); timerId=null;
  sX=cfg.x; sY=cfg.y;
  mine=Array.from({length:sY},()=&gt;Array(sX).fill(false));
  open =Array.from({length:sY},()=&gt;Array(sX).fill(false));
  flag =Array.from({length:sY},()=&gt;Array(sX).fill(false));
  started=false; over=false; won=false;
  mineLeft=cfg.mines; timeSec=0;
  minesEl.textContent=mineLeft; timerEl.textContent=&#x27;00:00&#x27;;
  setFace(&#x27;normal&#x27;);

  const wide = window.innerWidth&gt;=768;
  const cell = {easy:wide?38:32, mid:wide?26:22, hard:wide?22:19}[cfgKey()];
  boardEl.style.setProperty(&#x27;--x&#x27;, sX);
  boardEl.style.setProperty(&#x27;--cell&#x27;, cell+&#x27;px&#x27;);

  boardEl.innerHTML=&#x27;&#x27;;
  for(let y=0;y&lt;sY;y++) for(let x=0;x&lt;sX;x++){
    const d=document.createElement(&#x27;div&#x27;);
    d.className=&#x27;cell&#x27;; d.dataset.x=x; d.dataset.y=y;
    d.addEventListener(&#x27;click&#x27;,()=&gt;{ flagMode ? toggleFlag(x,y) : reveal(x,y); });
    d.addEventListener(&#x27;contextmenu&#x27;,e=&gt;{e.preventDefault();toggleFlag(x,y);});
    bindLongPress(d,x,y);
    boardEl.appendChild(d);
  }
  document.getElementById(&#x27;overlay&#x27;).classList.remove(&#x27;show&#x27;);
}

// 长按插旗（移动端无右键）
function bindLongPress(cell,x,y){
  let t=null, startedTouch=false;
  cell.addEventListener(&#x27;touchstart&#x27;,e=&gt;{
    if(open[y]&amp;&amp;open[y][x]) return;
    startedTouch=true;
    t=setTimeout(()=&gt;{ if(startedTouch){navigator.vibrate&amp;&amp;navigator.vibrate(15);toggleFlag(x,y);} },500);
  },{passive:true});
  cell.addEventListener(&#x27;touchend&#x27;,()=&gt;{clearTimeout(t);startedTouch=false;},{passive:true});
  cell.addEventListener(&#x27;touchmove&#x27;,()=&gt;{clearTimeout(t);startedTouch=false;},{passive:true});
}

// 首次点击布雷：排除点击点及其周围
function placeMines(fx,fy){
  const pool=[];
  for(let y=0;y&lt;sY;y++) for(let x=0;x&lt;sX;x++){
    const near=Math.abs(x-fx)&lt;=1 &amp;&amp; Math.abs(y-fy)&lt;=1;
    if(!near) pool.push([x,y]);
  }
  let placed=0;
  while(placed&lt;cfg.mines &amp;&amp; pool.length){
    const i=Math.floor(Math.random()*pool.length);
    const [x,y]=pool.splice(i,1)[0];
    mine[y][x]=true; placed++;
  }
}

// 相邻雷数
function adj(x,y){
  let c=0;
  for(let dy=-1;dy&lt;=1;dy++)for(let dx=-1;dx&lt;=1;dx++){
    if(!dx&amp;&amp;!dy)continue;
    const nx=x+dx,ny=y+dy;
    if(nx&gt;=0&amp;&amp;nx&lt;sX&amp;&amp;ny&gt;=0&amp;&amp;ny&lt;sY&amp;&amp;mine[ny][nx])c++;
  }
  return c;
}
function cellEl(x,y){return boardEl.querySelector(`.cell[data-x=&quot;${x}&quot;][data-y=&quot;${y}&quot;]`);}

// 开始计时
function startTimer(){
  if(started) return;
  started=true;
  timerId=setInterval(()=&gt;{
    timeSec++;
    const m=String(Math.floor(timeSec/60)).padStart(2,&#x27;0&#x27;);
    const s=String(timeSec%60).padStart(2,&#x27;0&#x27;);
    timerEl.textContent=`${m}:${s}`;
  },1000);
}

// 翻开
function reveal(x,y){
  if(over||open[y][x]||flag[y][x])return;
  if(!started){placeMines(x,y);startTimer();}
  if(mine[y][x]){return lost(x,y);}
  flood(x,y);
  checkWin();
}

function flood(x,y){
  if(x&lt;0||x&gt;=sX||y&lt;0||y&gt;=sY)return;
  if(open[y][x]||flag[y][x])return;
  open[y][x]=true;
  const el=cellEl(x,y); el.classList.add(&#x27;open&#x27;);
  const n=adj(x,y);
  if(n&gt;0){el.textContent=n;el.classList.add(&#x27;c&#x27;+n);}
  else{
    for(let dy=-1;dy&lt;=1;dy++)for(let dx=-1;dx&lt;=1;dx++)flood(x+dx,y+dy);
  }
}

// 插旗 / 取消
function toggleFlag(x,y){
  if(over||open[y][x])return;
  const el=cellEl(x,y);
  if(flag[y][x]){
    flag[y][x]=false; mineLeft++; el.textContent=&#x27;&#x27;; el.innerHTML=&#x27;&#x27;;
  }else{
    if(mineLeft&lt;=0)return;
    flag[y][x]=true; mineLeft--; el.innerHTML=ICON_FLAG;
  }
  minesEl.textContent=mineLeft;
}

// 踩雷失败
function lost(stepX,stepY){
  over=true; won=false; clearInterval(timerId); setFace(&#x27;lost&#x27;);
  for(let y=0;y&lt;sY;y++)for(let x=0;x&lt;sX;x++){
    const el=cellEl(x,y);
    if(mine[y][x]){
      el.innerHTML=ICON_MINE;
      if(x===stepX&amp;&amp;y===stepY){el.classList.add(&#x27;boom&#x27;);el.classList.remove(&#x27;open&#x27;);}
      else el.classList.add(&#x27;open&#x27;);
    }else if(flag[y][x]&amp;&amp;!mine[y][x]){
      el.classList.add(&#x27;wrong&#x27;); el.innerHTML=&#x27;✕&#x27;;
    }
  }
  setTimeout(()=&gt;showModal(&#x27;💥&#x27;,&#x27;踩雷了！&#x27;,&#x27;本局 &lt;b&gt;&#x27;+lvNames[cfgKey()]+&#x27;&lt;/b&gt;，用时 &lt;b&gt;&#x27;+timerEl.textContent+&#x27;&lt;/b&gt;。差一点就成功啦。&#x27;),400);
}

// 胜利
function checkWin(){
  let opened=0;
  for(let y=0;y&lt;sY;y++)for(let x=0;x&lt;sX;x++)if(open[y][x])opened++;
  if(opened&gt;=sX*sY-cfg.mines&amp;&amp;!over){
    over=true; won=true; clearInterval(timerId); setFace(&#x27;won&#x27;);
    showModal(&#x27;🏆&#x27;,&#x27;排雷成功！&#x27;,&#x27;本局 &lt;b&gt;&#x27;+lvNames[cfgKey()]+&#x27;&lt;/b&gt;，用时 &lt;b&gt;&#x27;+timerEl.textContent+&#x27;&lt;/b&gt;。&#x27;);
  }
}

function showModal(face,title,text){
  document.getElementById(&#x27;oFace&#x27;).textContent=face;
  document.getElementById(&#x27;oTitle&#x27;).textContent=title;
  document.getElementById(&#x27;oText&#x27;).innerHTML=text;
  document.getElementById(&#x27;overlay&#x27;).classList.add(&#x27;show&#x27;);
}

function cfgKey(){
  return Object.keys(LEVELS).find(k=&gt;LEVELS[k]===cfg);
}

// ===== 事件 =====
// 模式切换：翻开 / 标旗
const modeSwitch=document.getElementById(&#x27;modeSwitch&#x27;);
const modeTip=document.getElementById(&#x27;modeTip&#x27;);
function setMode(m){
  flagMode = (m===&#x27;flag&#x27;);
  modeSwitch.querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;on&#x27;,x.dataset.mode===m));
  modeTip.textContent = flagMode ? &#x27;点格子插旗，再点取消&#x27; : &#x27;点格子翻开&#x27;;
}
modeSwitch.addEventListener(&#x27;click&#x27;,e=&gt;{
  const b=e.target.closest(&#x27;button&#x27;); if(!b)return;
  setMode(b.dataset.mode);
});

document.getElementById(&#x27;levels&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{
  const b=e.target.closest(&#x27;button&#x27;); if(!b)return;
  document.querySelectorAll(&#x27;#levels button&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
  b.classList.add(&#x27;on&#x27;);
  cfg=LEVELS[b.dataset.lv]; init();
});
document.getElementById(&#x27;resetBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;init());
document.getElementById(&#x27;oAgain&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;init());
document.getElementById(&#x27;oClose&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;document.getElementById(&#x27;overlay&#x27;).classList.remove(&#x27;show&#x27;));
// 点击浮层空白处也可关闭，关闭后即可用笑脸/棋盘重开
document.getElementById(&#x27;overlay&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{
  if(e.target===document.getElementById(&#x27;overlay&#x27;)) document.getElementById(&#x27;overlay&#x27;).classList.remove(&#x27;show&#x27;);
});

init();

<script>
// ---------- 全局安全包装 ----------
function safeWrap(fn, ...args){
  try{ fn.apply(null, args); }catch(e){ console.error(e); shakeScreen?.(); }
}

// ---------- 页面切换 ----------
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ---------- 计算器逻辑 ----------
const MAX_EXPR_LEN = 180;
const MAX_DECIMAL = 16;
const MAX_HISTORY = 30;

let expr = '';
let justCalculated = false;
let history = [];

const screenEl = document.getElementById('calc-screen');
const preEl = document.getElementById('calc-pre');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');

function formatNumWithComma(str){
  if(str === '错误') return str;
  const parts = str.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
function setFontSize(){
  const len = (expr||'0').length;
  let fs = 42;
  if(len>12) fs=34; if(len>22) fs=28; if(len>35) fs=22;
  screenEl.style.fontSize = fs+'px';
}
function updateUI(){
  const raw = expr || '0';
  screenEl.textContent = formatNumWithComma(raw);
  setFontSize();
}
function shakeScreen(){
  screenEl?.classList.add('shake');
  setTimeout(()=>screenEl?.classList.remove('shake'),400);
}
function isOp(c){ return ['+','-','*','/'].includes(c); }
function lastIsNumOrBracket(){ if(!expr) return false; return /[0-9\)]/.test(expr.slice(-1)); }

function toPlainString(n){
  if(!isFinite(n)) return '错误';
  let s = String(n);
  if(/e/i.test(s)) s = Number(n).toPrecision(MAX_DECIMAL);
  s = parseFloat(s).toFixed(MAX_DECIMAL);
  s = s.replace(/(\.\d*?[1-9])0+$/, '$1').replace(/\.0+$/, '');
  return s === '' ? '0' : s;
}

function safeEval(str){
  try{
    let s = str.replace(/\s/g,'');
    if(!/^[\d\.\+\-\*\/\(\)]*$/.test(s)) return null;
    const left = (s.match(/\(/g)||[]).length;
    const right = (s.match(/\)/g)||[]).length;
    if(left !== right) return null;
    const fn = new Function('"use strict";return (' + s + ')');
    const r = fn();
    if(!isFinite(r)) return null;
    return Number(r.toFixed(MAX_DECIMAL));
  }catch(e){ console.error('safeEval',e); return null; }
}

function calcInput(ch){
  if(expr === '错误'){ expr=''; justCalculated=false; }
  if(expr.length >= MAX_EXPR_LEN) return;
  if(justCalculated){ if(/[0-9\(]/.test(ch)) expr=''; justCalculated=false; }
  if(ch === '÷') ch='/'; if(ch === '×') ch='*'; if(ch === '−') ch='-';

  if(isOp(ch)){
    if(!expr){ if(ch==='-') expr += ch; updateUI(); return; }
    const last = expr.slice(-1);
    if(isOp(last)) expr = expr.slice(0,-1)+ch;
    else if(last==='('){ if(ch==='-') expr+=ch; }
    else expr+=ch;
  }else if(ch === '('){
    if(expr && lastIsNumOrBracket()) expr += '*'; expr += '(';
  }else if(ch === ')'){
    const lc=(expr.match(/\(/g)||[]).length;
    const rc=(expr.match(/\)/g)||[]).length;
    if(lc>rc && lastIsNumOrBracket()) expr += ')';
  }else{
    if(expr==='0' && /[0-9]/.test(ch)) expr=ch; else expr+=ch;
  }
  updateUI();
}

function calcDot(){
  if(expr==='错误'){ expr=''; justCalculated=false; }
  if(justCalculated){ expr=''; justCalculated=false; }
  if(expr.length>=MAX_EXPR_LEN) return;
  const parts = expr.split(/[\+\-\*\/\(\)]/);
  const lastPart = parts[parts.length-1];
  if(!lastPart.includes('.')){
    if(lastPart===''||lastPart==='-') expr+='0.'; else expr+='.';
  }
  updateUI();
}

function _getLastNumberInfo(){
  if(!expr) return null;
  const m = expr.match(/(?<![\d.)])(-?[\d.]+)$/);
  if(!m) return null;
  const num = parseFloat(m[1]);
  if(isNaN(num)) return null;
  return { before:expr.slice(0,expr.length-m[1].length), num:num };
}
function calcMinus(){ const i=_getLastNumberInfo(); if(!i)return; expr=i.before+'('+(-i.num)+')'; updateUI(); }
function calcPercent(){ const i=_getLastNumberInfo(); if(!i)return; expr=i.before+(i.num/100); updateUI(); }
function calcSquare(){ const i=_getLastNumberInfo(); if(!i)return; expr=i.before+'('+(i.num*i.num)+')'; updateUI(); }
function calcClear(){ expr=''; justCalculated=false; preEl.textContent=''; updateUI(); }
function calcDel(){ if(expr==='错误')expr='';else expr=expr.slice(0,-1); preEl.textContent=''; updateUI(); }

function pushHistory(formula, resStr){
  history.unshift({ f:formula, r:resStr });
  if(history.length>MAX_HISTORY) history.pop(); renderHistory();
}
function renderHistory(){
  historyList.innerHTML='';
  history.forEach(h=>{
    const d=document.createElement('div'); d.className='history-item';
    d.textContent=`${h.f} = ${h.r}`;
    d.onclick=()=>{ expr=h.r; justCalculated=false; preEl.textContent=''; updateUI(); historyPanel.classList.remove('show'); };
    historyList.appendChild(d);
  });
}
function toggleHistory(){ historyPanel.classList.toggle('show'); }
function clearHistory(){ history=[]; renderHistory(); }

function calcEqual(){
  if(!expr) return;
  const src=expr;
  const clean = src.replace(/[+\-*/]+$/, '');   // 容忍末尾运算符：1+1+1+ 按 1+1+1 计算
  const res=safeEval(clean);
  if(res===null){ expr='错误'; shakeScreen(); justCalculated=false; }
  else{ const s=toPlainString(res); preEl.textContent=clean+' ='; pushHistory(clean,s); expr=s; justCalculated=true; }
  updateUI();
}

document.addEventListener('keydown',e=>safeWrap(()=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if(!document.getElementById('page-calc').classList.contains('active')) return;
  const k=e.key;
  if(expr.length>=MAX_EXPR_LEN && /[\d\.\+\-\*\/\(\)]/.test(k)) return;
  if(/[\d\+\-\*\/\(\)\.]/.test(k)) calcInput(k);
  else if(k==='Enter'||k==='=') calcEqual();
  else if(k==='Escape') calcClear();
  else if(k==='Backspace') calcDel();
}));

updateUI(); renderHistory();

// ---------- 地图查看器（兼容GitHub Pages，crossOrigin处理跨域） ----------
const mapImages = {
  "world":"./world.jpg",
  "china-admin":"./china-admin.jpg",
  "china-terrain":"./china-terrain.jpg",
  "gd":"./gd.jpg"
};

const viewImg = document.getElementById('viewImg');
const mapSelect = document.getElementById('mapSelect');
const loadHint = document.getElementById('loadHint');

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDrag = false;
let lastX = 0;
let lastY = 0;

function applyTransform(){
  viewImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}
function resetMapView(){
  scale = 1; offsetX = 0; offsetY = 0; applyTransform();
}

function setMapSrc(key){
  loadHint.style.display = 'block';
  loadHint.textContent = '地图加载中…';
  const url = mapImages[key];
  const tempImg = new Image();
  tempImg.crossOrigin = "anonymous";
  tempImg.onload = ()=>{
    viewImg.style.backgroundImage = `url("${url}")`;
    loadHint.style.display = 'none';
    resetMapView();
  };
  tempImg.onerror = ()=>{
    loadHint.textContent = '⚠️ 读取失败：检查图片文件名大小写、是否上传到Pages绑定分支根目录';
  };
  tempImg.src = url;
}

mapSelect.addEventListener('change', e=> setMapSrc(e.target.value));
setMapSrc(mapSelect.value);

document.getElementById('viewWrap').addEventListener('wheel', e=>{
  e.preventDefault();
  const d = e.deltaY > 0 ? -0.12 : 0.12;
  scale = Math.max(0.5, Math.min(scale + d, 4));
  applyTransform();
},{passive:false});

viewImg.addEventListener('mousedown',e=>{ isDrag=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mousemove',e=>{
  if(!isDrag) return;
  offsetX += e.clientX - lastX; offsetY += e.clientY - lastY;
  lastX=e.clientX; lastY=e.clientY; applyTransform();
});
window.addEventListener('mouseup',()=>{ isDrag=false; });

let touchId = null;
viewImg.addEventListener('touchstart',e=>{
  if(touchId!==null)return;
  const t = e.changedTouches[0]; touchId = t.identifier;
  isDrag=true; lastX=t.clientX; lastY=t.clientY;
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(!isDrag)return;
  for(let t of e.changedTouches){
    if(t.identifier===touchId){
      offsetX += t.clientX-lastX; offsetY += t.clientY-lastY;
      lastX=t.clientX; lastY=t.clientY; applyTransform(); break;
    }
  }
},{passive:true});
window.addEventListener('touchend',e=>{
  for(let t of e.changedTouches){
    if(t.identifier===touchId){ touchId=null; isDrag=false; break; }
  }
});

// ---------- 证书奖状生成器 ----------
document.getElementById('dateInput').valueAsDate = new Date();
let currentTemplate = 1;

function selectTemplate(num) {
  currentTemplate = num;
  document.getElementById('templateSel').value = num;
  document.querySelectorAll('#page-cert .template-card[data-tpl]').forEach(el => el.classList.remove('active'));
  document.querySelector(`#page-cert .template-card[data-tpl="${num}"]`).classList.add('active');
  renderPreview();
}

function updateTypeCard() {
  const type = document.querySelector('#page-cert input[name="docType"]:checked').value;
  document.getElementById('typeCertCard').classList.toggle('active', type === 'cert');
  document.getElementById('typeAwardCard').classList.toggle('active', type === 'award');
}

// 生成半圆形公章文字
function createStamp(stampText) {
  const text = stampText.trim() || '公章';
  const chars = text.split('');
  const total = chars.length;
  const radius = 56;
  const angleStep = 180 / Math.max(total - 1, 1);
  const startAngle = 90;

  let ringHtml = '';
  chars.forEach((ch, i) => {
    const angle = startAngle - i * angleStep;
    ringHtml += `<span style="position:absolute;top:0;left:50%;width:14px;height:112px;transform-origin:center 56px;transform:translateX(-50%) rotate(${angle}deg);text-align:center;font-weight:900;font-size:14px;color:#b91c1c;">${escapeHtml(ch)}</span>`;
  });

  return `
    <div class="stamp">
      <div class="stamp-ring-text">${ringHtml}</div>
      <div class="stamp-star">★</div>
      <div class="stamp-center">公 章</div>
    </div>
  `;
}

function renderPreview() {
  const docType = document.querySelector('#page-cert input[name="docType"]:checked').value;
  updateTypeCard();

  const title = document.getElementById('title').value || '证书';
  const name = document.getElementById('name').value || '姓名';
  const content = document.getElementById('content').value || '请填写正文内容。';
  const issuer = document.getElementById('issuer').value || '发奖人';
  const stampText = document.getElementById('stampText').value || '公章';
  const dateRaw = document.getElementById('dateInput').value;

  let showDate = '';
  if (dateRaw) {
    const d = new Date(dateRaw);
    showDate = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }
  const subTitleText = docType === "cert" ? "CERTIFICATE" : "荣 誉 奖 状";

  const previewBox = document.getElementById('previewBox');
  previewBox.innerHTML = '';

  let paper = document.createElement('div');
  paper.className = `template${currentTemplate} cert-paper`;

  let inner = `
        <div class="title">${escapeHtml(title)}</div>
        <div class="subtitle">${subTitleText}</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="content">${escapeHtml(content)}</div>
        <div class="footer">
          <div>发奖人：${escapeHtml(issuer)}</div>
          <div style="margin-top:8px;">日期：${showDate}</div>
        </div>
        ${createStamp(stampText)}
    `;

  paper.innerHTML = inner;
  previewBox.appendChild(paper);
}

async function downloadImage() {
  const btn = document.getElementById('downloadBtn');
  const mask = document.getElementById('loadingMask');

  if (!document.querySelector('#page-cert .cert-paper')) {
    alert('预览未生成，请稍后重试。');
    return;
  }

  btn.disabled = true;
  mask.classList.add('show');

  try {
    const target = document.querySelector('#page-cert .cert-paper');
    const canvas = await html2canvas(target, {
      scale: 2,
      useCORS: true,
      backgroundColor: null
    });

    const link = document.createElement('a');
    link.download = `证书_${document.getElementById('name').value || '导出'}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) {
    alert('图片生成失败，请重试。');
    console.error(err);
  } finally {
    mask.classList.remove('show');
    btn.disabled = false;
  }
}

renderPreview();

// ---------- 抽奖工具逻辑 ----------
function loadLocal(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function saveLocal(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function switchView(id){
  document.querySelectorAll('#page-lottery .view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  document.getElementById('tabDraw').classList.toggle('active', id==='draw');
  document.getElementById('tabWheel').classList.toggle('active', id==='wheel');
  if(id==='wheel') renderWheelList();
}

/* ---- 名单抽取 ---- */
let drawItems = [];
let drawWinners = [];
let drawPool = [];   // 完整名单副本：供“重新抽奖”恢复

function parseList(text){
  const arr = text.split(/[\s,，、;；\n\r]+/).map(s=>s.trim()).filter(s=>s.length>0);
  return [...new Set(arr)];
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderList(){
  document.getElementById('drawCount').textContent = drawItems.length;
  const box = document.getElementById('drawList');
  box.innerHTML = drawItems.map(n=>`<span class="name-chip">${escapeHtml(n)}</span>`).join('') || '<span class="hint">暂无名单</span>';
  const num = document.getElementById('drawNum');
  num.max = Math.max(drawItems.length,1);
  if(drawItems.length>0 && (+num.value<1 || +num.value>drawItems.length)) num.value = Math.min(1,drawItems.length);
}

function loadFile(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('drawInput').value = ev.target.result;
    drawItems = parseList(ev.target.result);
    renderList();
  };
  reader.readAsText(f, 'utf-8');
  e.target.value = '';
}

document.getElementById('drawInput').addEventListener('input', function(){
  drawItems = parseList(this.value);
  renderList();
});

function resetDraw(){
  drawWinners = [];
  document.getElementById('winnersBox').innerHTML = '';
  document.getElementById('rollingBox').querySelector('span').textContent = '';
  if(drawPool.length){ drawItems = [...drawPool]; renderList(); }
}
function clearDraw(){
  document.getElementById('drawInput').value = '';
  drawItems = [];
  drawWinners = [];
  drawPool = [];
  renderList();
  resetDraw();
}

let rollingTimer = null, spinning = false;

function startDraw(){
  if(drawItems.length===0){ alert('请先输入名单'); return; }
  const num = parseInt(document.getElementById('drawNum').value,10);
  if(num<1 || num>drawItems.length){ alert('抽取数量需在 1 ~ '+drawItems.length+' 之间'); return; }
  if(spinning) return;
  spinning = true;
  document.getElementById('startBtn').disabled = true;
  drawWinners = [];

  const rolling = document.getElementById('rollingBox').querySelector('span');
  rolling.textContent = '🎲 抽奖中…';
  let tick = 0;
  rollingTimer = setInterval(()=>{
    rolling.textContent = drawItems[Math.floor(Math.random()*drawItems.length)];
    tick++;
    if(tick>20){ clearInterval(rollingTimer); finalizeDraw(num); }
  }, 70);
}

function finalizeDraw(num){
  const pool = [...drawItems];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  drawWinners = pool.slice(0,num);
  drawPool = [...drawItems];   // 保留完整名单副本，供重新抽奖恢复
  drawWinners.forEach(w=>{ drawItems = drawItems.filter(x=>x!==w); });

  document.getElementById('rollingBox').querySelector('span').textContent = '🎉 抽奖完成';
  document.getElementById('winnersBox').innerHTML = drawWinners.map(w=>`<div class="winner">${escapeHtml(w)}</div>`).join('');
  renderList();
  document.getElementById('startBtn').disabled = false;
  spinning = false;
}

/* ---- 转盘抽选 ---- */
const PALETTE = ['#48bb78','#3182ce','#d69e2e','#e53e3e','#805ad5','#dd6b20','#2b6cb0','#38a169','#b7791f','#c53030','#6b46c1','#e53e3e','#4f46e5','#0d9488','#db2777'];

const DEFAULT_WHEELS = [
  {id:'w1', name:'今天吃什么', options:['火锅','烤肉','面条','米饭','炒菜','寿司','汉堡','披萨']},
  {id:'w2', name:'摇个骰子', options:['1','2','3','4','5','6']},
  {id:'w3', name:'早上吃什么', options:['煎蛋','三明治','牛奶','麦片','粽子']},
  {id:'w4', name:'今天中午吃什么', options:['沙拉','三明治','炒饭','拉面','小炒']},
  {id:'w5', name:'今天晚上吃什么', options:['烧烤','火锅','寿司','粤菜','川菜']},
  {id:'w6', name:'约不约她出去?', options:['约','不约']},
  {id:'w7', name:'打什么游戏', options:['英雄联盟','王者荣耀','穿越火线','绝地求生']},
  {id:'w8', name:'看什么书', options:['小说','散文','杂志','漫画','传记']},
  {id:'w9', name:'看什么电影', options:['喜剧','动作','爱情','科幻','恐怖']},
  {id:'w10', name:'做什么活动', options:['跑步','健身','游泳','打球','看剧','聚会']}
];

function getWheels(){
  const saved = loadLocal('choujiang_wheels', null);
  if(saved && saved.length) return saved;
  saveLocal('choujiang_wheels', DEFAULT_WHEELS);
  return DEFAULT_WHEELS;
}
function saveWheels(w){ saveLocal('choujiang_wheels', w); }

function renderWheelList(){
  const wheels = getWheels();
  const box = document.getElementById('wheelList');
  box.innerHTML = wheels.map((w,i)=>{
    const color = PALETTE[i % PALETTE.length];
    return `<div class="wheel-item" onclick="safeWrap(openWheel,'${w.id}')">
      <div class="wheel-icon" style="background:${color};color:#fff;">${escapeHtml(w.name.slice(0,1))}</div>
      <div class="wheel-info">
        <div class="wheel-name">${escapeHtml(w.name)}</div>
        <div class="wheel-opts">${escapeHtml(w.options.join('  '))}</div>
      </div>
      <div class="wheel-actions">
        <button class="edit" onclick="event.stopPropagation();safeWrap(openEditWheel,'${w.id}')">✎</button>
        <button class="del" onclick="event.stopPropagation();safeWrap(deleteWheel,'${w.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function deleteWheel(id){
  if(!confirm('确定删除该转盘？')) return;
  const wheels = getWheels().filter(w=>w.id!==id);
  saveWheels(wheels);
  renderWheelList();
}

let editingId = null;
function openEditWheel(id){
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '编辑转盘' : '新建转盘';
  document.getElementById('mName').value = '';
  document.getElementById('mOpts').value = '';
  if(id){
    const w = getWheels().find(x=>x.id===id);
    if(w){ document.getElementById('mName').value = w.name; document.getElementById('mOpts').value = w.options.join(' '); }
  }
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); editingId=null; }

function saveWheel(){
  const name = document.getElementById('mName').value.trim();
  const opts = parseList(document.getElementById('mOpts').value);
  if(!name){ alert('请输入转盘名称'); return; }
  if(opts.length<2){ alert('至少需要 2 个选项'); return; }
  const wheels = getWheels();
  if(editingId){
    const idx = wheels.findIndex(x=>x.id===editingId);
    if(idx>=0){ wheels[idx].name = name; wheels[idx].options = opts; }
  }else{
    wheels.push({id:'w'+Date.now(), name, options:opts});
  }
  saveWheels(wheels);
  closeModal();
  renderWheelList();
}

let currentWheel = null;
let wheelAngle = 0;
let wheelAnim = null;

function openWheel(id){
  currentWheel = getWheels().find(w=>w.id===id);
  if(!currentWheel) return;
  document.getElementById('stageTitle').textContent = currentWheel.name;
  document.getElementById('spinResult').textContent = '';
  document.getElementById('wheelListCard').style.display = 'none';
  document.getElementById('wheelStage').classList.add('show');
  wheelAngle = 0;
  drawWheel();
}

function backToList(){
  document.getElementById('wheelStage').classList.remove('show');
  document.getElementById('wheelListCard').style.display = '';
  currentWheel = null;
  if(wheelAnim){ cancelAnimationFrame(wheelAnim); wheelAnim = null; }
  document.getElementById('spinBtn').disabled = false;
}

function drawWheel(){
  const c = document.getElementById('wheelCanvas');
  const holder = document.getElementById('wheelHolder');
  const size = holder.clientWidth;
  c.width = size*2; c.height = size*2;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);

  const n = currentWheel.options.length;
  const center = c.width/2, r = c.width/2 - 10;
  const startA = -Math.PI/2 + wheelAngle;

  for(let i=0;i<n;i++){
    const a0 = startA + (i*2*Math.PI)/n;
    const a1 = startA + ((i+1)*2*Math.PI)/n;
    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(a0 + (a1-a0)/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + (size*0.09) + 'px sans-serif';
    ctx.fillText(currentWheel.options[i], r-14, 6);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(center, center, r, 0, 2*Math.PI);
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
}

function spinWheel(){
  if(!currentWheel || wheelAnim) return;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinResult').textContent = '';
  const n = currentWheel.options.length;
  const extraSpins = 5 + Math.floor(Math.random()*4);
  const target = wheelAngle + extraSpins*2*Math.PI + Math.random()*2*Math.PI;

  const start = wheelAngle;
  const startTime = performance.now();
  const dur = 4000;
  function ease(t){ return 1 - Math.pow(1-t, 3); }

  function step(now){
    const p = Math.min((now-startTime)/dur, 1);
    const eased = ease(p);
    wheelAngle = start + (target-start)*eased;
    drawWheel();
    if(p<1){ wheelAnim = requestAnimationFrame(step); }
    else{
      wheelAnim = null;
      document.getElementById('spinBtn').disabled = false;
      const twoPi=2*Math.PI, delta=twoPi/n;
      const normalized=((-wheelAngle%twoPi)+twoPi)%twoPi;
      const sector=Math.floor(normalized/delta)%n;
      const result=currentWheel.options[sector];
      document.getElementById('spinResult').textContent = '🎉 ' + result;
    }
  }
  wheelAnim = requestAnimationFrame(step);
}

renderList();
</script>
